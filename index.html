<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Web AR Video</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background-color: #000; }
      
      /* Màn hình đen chặn lại nếu trình duyệt không cho video tự chạy */
      #force-play-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        display: none; /* Mặc định ẩn */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
        text-align: center;
      }
      
      .play-btn {
        background: #FF3B30;
        color: white;
        padding: 15px 40px;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        margin-top: 20px;
        text-transform: uppercase;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="force-play-overlay">
      <h2>Đã nhận diện thành công!</h2>
      <div class="play-btn">Chạm để phát Video</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./anhnhandien.mind; filterMinCF: 0.1; filterBeta: 10" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="arVideo" 
          src="./video.mp4" 
          loop="true" 
          crossorigin="anonymous"
          webkit-playsinline="true"
          playsinline="true"
          muted="true"
          preload="auto">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          src="#arVideo" 
          position="0 0 0" 
          height="0.56" 
          width="1" 
          rotation="0 0 0">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector("#arVideo");
      const targetEntity = document.querySelector('[mindar-image-target]');
      const overlay = document.querySelector("#force-play-overlay");

      // Xử lý khi người dùng chạm vào màn hình đen
      overlay.addEventListener("click", () => {
        video.play();
        overlay.style.display = "none";
      });

      // Bắt sự kiện quét trúng ảnh
      targetEntity.addEventListener("targetFound", () => {
        // Thử ép video tự động chạy
        let playPromise = video.play();
        
        if (playPromise !== undefined) {
          playPromise.then(() => {
            // Video tự chạy mượt mà, không cần làm gì thêm
            overlay.style.display = "none";
          }).catch(error => {
            // Trình duyệt chặn tự động phát! Bật màn hình đen lên bắt click
            overlay.style.display = "flex";
          });
        }
      });

      // Bắt sự kiện khi điện thoại lia ra khỏi ảnh
      targetEntity.addEventListener("targetLost", () => {
        video.pause();
        overlay.style.display = "none"; // Giấu overlay đi (nếu đang hiện)
      });
    </script>
  </body>
</html>

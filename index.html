<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 999; display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.5); color: white; font-family: sans-serif;
        text-align: center; padding: 20px; box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="overlay">CHẠM VÀO MÀN HÌNH<br>ĐỂ BẮT ĐẦU TRẢI NGHIỆM</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./anhnhandien.mind; autoStart: true;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="arVideo" 
          src="./video.mp4" 
          loop="true" 
          crossorigin="anonymous"
          webkit-playsinline
          playsinline
          muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-video 
          src="#arVideo" 
          width="1" 
          height="0.56" 
          position="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector("#arVideo");
      const overlay = document.querySelector("#overlay");
      const target = document.querySelector('#target1');

      // Chạm bất cứ đâu trên màn hình để kích hoạt âm thanh
      window.addEventListener('click', () => {
        video.muted = false;
        video.play();
        overlay.style.display = "none";
      });

      window.addEventListener('touchstart', () => {
        video.muted = false;
        video.play();
        overlay.style.display = "none";
      });

      target.addEventListener("targetFound", () => video.play());
      target.addEventListener("targetLost", () => video.pause());
    </script>
  </body>
</html>

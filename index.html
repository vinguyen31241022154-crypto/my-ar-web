<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      /* Nút Play vì trình duyệt thường chặn video tự chạy có âm thanh */
      #playButton {
        position: fixed; top: 10px; left: 10px; z-index: 999;
        padding: 10px; background: #000; color: #fff; border: none; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="playButton">Bấm để bắt đầu AR</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="arVideo" src="./your-video.mp4" loop="true" crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#arVideo" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.querySelector("#playButton");
      const video = document.querySelector("#arVideo");
      btn.addEventListener('click', () => {
        video.play();
        btn.style.display = "none";
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #loading {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: white; font-family: sans-serif; z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="loading">Đang tải AR...</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./anhnhandien.mind; uiLoading: #loading; autoStart: true;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="arVideo" 
          src="./video.mp4" 
          loop="true" 
          crossorigin="anonymous"
          webkit-playsinline
          playsinline
          muted
          autoplay>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target1" mindar-image-target="targetIndex: 0">
        <a-video 
          src="#arVideo" 
          width="1" 
          height="0.56" 
          position="0 0 0.01">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector("#arVideo");
      const loading = document.querySelector("#loading");
      const scene = document.querySelector('a-scene');
      const target = document.querySelector('#target1');

      scene.addEventListener("arReady", () => {
        loading.style.display = "none";
      });

      target.addEventListener("targetFound", () => {
        video.play();
      });

      target.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Web AR Video</title>

    <script src="[aframe.io](https://aframe.io/releases/1.5.0/aframe.min.js)"></script>
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js)"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      #status {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
      }

      #status.hidden {
        display: none;
      }

      #error {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.88);
        color: #fff;
      }

      #error.show {
        display: flex;
      }

      .error-box {
        max-width: 360px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div id="status">Đang khởi động AR...</div>

    <div id="error">
      <div class="error-box" id="errorText">
        Không thể khởi động camera hoặc video.
      </div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./anhnhandien.mind; autoStart: true; uiScanning: true; uiLoading: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets timeout="10000">
        <video
          id="arVideo"
          src="./video.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-video
          id="videoPlane"
          src="#arVideo"
          position="0 0 0"
          width="1"
          height="0.5625"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById("arVideo");
      const target = document.getElementById("target");
      const status = document.getElementById("status");
      const errorBox = document.getElementById("error");
      const errorText = document.getElementById("errorText");

      let targetVisible = false;
      let canPlayVideo = false;

      const showStatus = (text) => {
        status.textContent = text;
        status.classList.remove("hidden");
      };

      const hideStatus = () => {
        status.classList.add("hidden");
      };

      const showError = (text) => {
        errorText.textContent = text;
        errorBox.classList.add("show");
      };

      async function prepareVideo() {
        try {
          video.muted = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          video.setAttribute("webkit-playsinline", "");

          // Thử autoplay sẵn ngay khi load
          await video.play();
          video.pause();
          video.currentTime = 0;
          canPlayVideo = true;
        } catch (err) {
          canPlayVideo = false;
          console.warn("Video autoplay bị chặn:", err);
        }
      }

      async function playVideoIfPossible() {
        if (!canPlayVideo) {
          await prepareVideo();
        }

        try {
          await video.play();
          hideStatus();
        } catch (err) {
          console.error("Không phát được video:", err);
          showError(
            "Camera đã mở nhưng trình duyệt đang chặn tự phát video. Hãy mở bằng Chrome/Safari mới nhất và đảm bảo video có thuộc tính muted."
          );
        }
      }

      target.addEventListener("targetFound", async () => {
        targetVisible = true;
        showStatus("Đã nhận diện ảnh, đang phát video...");
        await playVideoIfPossible();
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        video.pause();
        showStatus("Đưa camera vào ảnh để xem video");
      });

      video.addEventListener("loadeddata", () => {
        console.log("Video loadeddata");
      });

      video.addEventListener("playing", () => {
        console.log("Video is playing");
      });

      video.addEventListener("error", (e) => {
        console.error("Lỗi video:", e);
        showError("Không tải được file video.mp4. Hãy kiểm tra tên file, định dạng và đường dẫn.");
      });

      window.addEventListener("load", async () => {
        showStatus("Đang xin quyền camera...");
        await prepareVideo();

        setTimeout(() => {
          if (!targetVisible) {
            showStatus("Đưa camera vào ảnh để xem video");
          }
        }, 1500);
      });
    </script>
  </body>
</html>
